<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1ab"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="31.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Multithreaded Merge Sort: left half runs in a new thread</text>
<rect x="270" y="50" width="120" height="40" rx="20" fill="#e3edfb" stroke="#2f6fd6" stroke-width="2"/><text x="330" y="74.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Start</text><polygon points="214,114 474,114 446,156 186,156" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="330" y="139.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Input array a, depth = 3 (8 threads)</text><polygon points="330,178 445,220 330,262 215,220" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5"/><text x="330" y="216.10000000000002" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Part has more than</text><text x="330" y="233.00000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">one element?</text><rect x="200" y="289" width="260" height="42" rx="6" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="330" y="306.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Find middle</text><text x="330" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">m = (l + r) / 2</text><polygon points="330,355 465,405 330,455 195,405" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5"/><text x="330" y="401.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">depth &gt; 0 and</text><text x="330" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">size &gt; THRESHOLD ?</text><rect x="60" y="485" width="230" height="50" rx="6" fill="#fff1e8" stroke="#e8a27a" stroke-width="1.5"/><text x="175" y="506.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Create new thread:</text><text x="175" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">sort left half (depth-1)</text><rect x="60" y="555" width="230" height="50" rx="6" fill="#fff1e8" stroke="#e8a27a" stroke-width="1.5"/><text x="175" y="576.0999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Current thread:</text><text x="175" y="592.9999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">sort right half (depth-1)</text><rect x="60" y="625" width="230" height="50" rx="6" fill="#fff1e8" stroke="#e8a27a" stroke-width="1.5"/><text x="175" y="646.0999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">join(): wait until the</text><text x="175" y="662.9999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">left thread finishes</text><rect x="375" y="516" width="210" height="58" rx="6" fill="#eef4ff" stroke="#c5cad1" stroke-width="1.5"/><text x="480" y="532.65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Sort both halves</text><text x="480" y="549.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">one after another</text><text x="480" y="566.4499999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">(no new thread)</text><rect x="200" y="715" width="260" height="50" rx="6" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="330" y="736.0999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Merge the two sorted halves</text><text x="330" y="752.9999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">into a[l .. r]</text><rect x="590" y="195" width="140" height="50" rx="6" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="660" y="224.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Return</text><polygon points="214,799 474,799 446,841 186,841" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="330" y="824.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Print sorted array</text><rect x="270" y="865" width="120" height="40" rx="20" fill="#e3edfb" stroke="#2f6fd6" stroke-width="2"/><text x="330" y="889.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Stop</text><path d="M330 90 L330 114" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M330 156 L330 178" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M330 262 L330 289" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><text x="348" y="278.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">yes</text><path d="M445 220 L590 220" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="214.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">no</text><path d="M330 331 L330 355" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M195 405 L175 405 L175 485" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><text x="170" y="399.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">yes</text><path d="M465 405 L480 405 L480 516" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><text x="490" y="399.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">no</text><path d="M175 535 L175 555" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M175 605 L175 625" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M175 675 L175 740 L200 740" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M480 574 L480 740 L460 740" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M330 765 L330 799" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M660 245 L660 785 L334 785" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M330 841 L330 865" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><text x="185" y="704.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c2410c" text-anchor="start">both halves run in parallel</text></svg>