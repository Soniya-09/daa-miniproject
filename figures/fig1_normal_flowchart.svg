<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1ab"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="31.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Normal Merge Sort: divide, sort each half, merge</text>
<rect x="240" y="50" width="120" height="40" rx="20" fill="#e3edfb" stroke="#2f6fd6" stroke-width="2"/><text x="300" y="74.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Start</text><polygon points="189,114 439,114 411,156 161,156" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="300" y="139.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Input n and array a[0 .. n-1]</text><rect x="175" y="179" width="250" height="42" rx="6" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="300" y="204.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Call mergeSort(a, 0, n-1)</text><polygon points="300,238 415,280 300,322 185,280" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5"/><text x="300" y="276.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Part has more than</text><text x="300" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">one element? (l &lt; r)</text><rect x="175" y="349" width="250" height="42" rx="6" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="300" y="366.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Find middle</text><text x="300" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">m = (l + r) / 2</text><rect x="175" y="414" width="250" height="42" rx="6" fill="#eef4ff" stroke="#c5cad1" stroke-width="1.5"/><text x="300" y="431.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">mergeSort(a, l, m)</text><text x="300" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">sort left half (recursive)</text><rect x="175" y="479" width="250" height="42" rx="6" fill="#eef4ff" stroke="#c5cad1" stroke-width="1.5"/><text x="300" y="496.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">mergeSort(a, m+1, r)</text><text x="300" y="513" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">sort right half (recursive)</text><rect x="175" y="540" width="250" height="50" rx="6" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="300" y="561.0999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Merge the two sorted halves</text><text x="300" y="577.9999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">into a[l .. r]</text><rect x="470" y="255" width="170" height="50" rx="6" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="555" y="276.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Return</text><text x="555" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">(one element is sorted)</text><polygon points="189,629 439,629 411,671 161,671" fill="#ffffff" stroke="#c5cad1" stroke-width="1.5"/><text x="300" y="654.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Print sorted array</text><rect x="240" y="695" width="120" height="40" rx="20" fill="#e3edfb" stroke="#2f6fd6" stroke-width="2"/><text x="300" y="719.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Stop</text><path d="M300 90 L300 114" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300 156 L300 179" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300 221 L300 238" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300 322 L300 349" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><text x="318" y="338.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">yes</text><path d="M415 280 L470 280" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><text x="440" y="274.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">no</text><path d="M300 391 L300 414" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300 456 L300 479" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300 521 L300 540" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300 590 L300 629" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M555 305 L555 610 L304 610" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300 671 L300 695" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M 175 435 L 95 435 L 95 280 L 185 280" fill="none" stroke="#2f6fd6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><path d="M 175 500 L 95 500 L 95 436" fill="none" stroke="#2f6fd6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="60" y="356.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#2f6fd6" text-anchor="middle">recursive</text><text x="60" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#2f6fd6" text-anchor="middle">call</text></svg>